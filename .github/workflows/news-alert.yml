name: News alert

# Every hour, day and night (URGENT-NEWS-1124): the watchlist's new news and filings are collected, each new item is
# judged once (low / medium / high / critical) and a critical one is emailed at once to Kevin and Thierry (« 🚨 Urgent »).
# Started at minute 40 by the dualis-cron Worker (`cron/`) with `trigger: schedule`. Its own concurrency group: never
# queued behind a long collect, and never two at once. It never sends the morning email (the 02:00 UTC collect does).
on:
  workflow_dispatch:
    inputs:
      trigger:
        description: "schedule (dualis-cron: a critical item is emailed to every recipient) or manual (nothing is emailed)"
        default: manual
        required: false
      mode:
        description: "test = one sample urgent email to Kevin only (never Thierry), subject [TEST]; empty = the normal run"
        default: ""
        required: false

concurrency:
  group: news-alert
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      CLAUDE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
      MAIL_TOKEN: ${{ secrets.MAIL_TOKEN }}
      MAIL_RECIPIENTS: ${{ secrets.MAIL_RECIPIENTS }}
      # A test run is never a scheduled one: it can only reach Kevin.
      COLLECT_TRIGGER: ${{ github.event.inputs.mode == 'test' && 'manual' || github.event.inputs.trigger || 'manual' }}
      URGENT_ALERT_MODE: ${{ github.event.inputs.mode || '' }}
    steps:
      - name: Required secrets are set
        working-directory: .
        run: |
          missing=""
          for name in DATABASE_URL CLAUDE_OAUTH_TOKEN MAIL_TOKEN MAIL_RECIPIENTS; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            for name in $missing; do echo "::error::Missing GitHub repo secret:$name"; done
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm collect news,filings,news-alert
